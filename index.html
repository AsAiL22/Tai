<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تاي">
<title>تاي</title>
<style>
  :root { --bg:#212121; --card:#2a2a2a; --me:#404040; --tai:#2d2d2d; --text:#ececec; --mute:#9b9b9b; --line:#4a4a4a; --accent:#5f5f5f; --a1:#8a8a8a; --a2:#c8c8c8; }
  :root[data-theme="pink"] { --bg:#1f1218; --card:#2e1a24; --me:#d6457f; --tai:#3a2230; --text:#fff0f6; --mute:#c49aae; --line:#5a3446; --accent:#d6457f; --a1:#ff6fa5; --a2:#ffb3cf; }
  :root[data-theme="navy"] { --bg:#0b1220; --card:#121c33; --me:#2a5bd7; --tai:#17243f; --text:#eaf0ff; --mute:#8fa0c4; --line:#27385c; --accent:#2a5bd7; --a1:#2a5bd7; --a2:#6fb1ff; }
  :root[data-theme="purple"] { --bg:#14111f; --card:#221d33; --me:#6b4eff; --tai:#2d2745; --text:#f3f0ff; --mute:#9a93b8; --line:var(--line); --accent:#6b4eff; --a1:#6b4eff; --a2:#ff7ab8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; max-width:640px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background:var(--card); }
  .avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--a1),var(--a2)) center/cover;
    display:grid; place-items:center; font-weight:700; font-size:18px; flex:none; }
  header .name { font-weight:700; }
  header .status { font-size:12px; color:var(--mute); }
  header .sp { flex:1; }
  .ibtn { background:none; border:none; color:var(--text); font-size:22px; padding:6px; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:18px; line-height:1.6; white-space:pre-wrap; word-break:break-word; font-size:16px; }
  .me { align-self:flex-start; background:var(--me); border-bottom-right-radius:4px; }
  .tai { align-self:flex-end; background:var(--tai); border-bottom-left-radius:4px; }
  .typing { color:var(--mute); }
  form { display:flex; gap:8px; align-items:flex-end; padding:10px 12px calc(env(safe-area-inset-bottom) + 10px); background:var(--card); }
  textarea { flex:1; resize:none; max-height:120px; background:var(--bg); color:var(--text); border:1px solid var(--line);
    border-radius:20px; padding:10px 14px; font-size:16px; font-family:inherit; outline:none; }
  .round { width:44px; height:44px; border-radius:50%; border:none; font-size:20px; color:#fff; background:var(--accent); cursor:pointer; flex:none; }
  .round.mic { background:var(--line); }
  .round.mic.on { background:#e5484d; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.1); } }
  dialog { background:var(--card); color:var(--text); border:none; border-radius:18px; padding:18px; width:min(92vw,420px); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog label { display:block; margin:12px 0 4px; font-size:14px; color:var(--mute); }
  dialog input, dialog select, dialog textarea.mem { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line);
    border-radius:12px; padding:10px; font-size:16px; font-family:inherit; direction:ltr; }
  dialog textarea.mem { direction:rtl; min-height:110px; border-radius:12px; }
  .row { display:flex; gap:8px; margin-top:16px; }
  .btn { flex:1; padding:12px; border:none; border-radius:12px; font-size:16px; color:#fff; background:var(--accent); cursor:pointer; }
  .btn.alt { background:var(--line); }
  .check { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .check input { width:auto; }
  #voice { position:fixed; inset:0; background:var(--bg); z-index:50; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; text-align:center; }
  #voice.show { display:flex; }
  #vavatar { width:150px; height:150px; border-radius:50%; font-size:60px; }
  #vavatar.talk { animation:pulse 1.2s infinite; }
  #vstate { color:var(--mute); font-size:16px; min-height:22px; }
  #vtext { max-width:520px; max-height:34vh; overflow-y:auto; font-size:18px; line-height:1.7; min-height:30px; }
  #vbtn { width:84px; height:84px; font-size:34px; }
  #vclose { background:none; border:1px solid var(--line); color:var(--text); border-radius:20px; padding:10px 24px; font-size:16px; cursor:pointer; }
  #pend { display:none; gap:8px; padding:8px 12px 0; background:var(--card); flex-wrap:wrap; }
  #pend.show { display:flex; }
  .pitem { position:relative; width:58px; height:58px; }
  .pitem img { width:58px; height:58px; object-fit:cover; border-radius:10px; }
  .pitem button { position:absolute; top:-6px; left:-6px; width:22px; height:22px; border-radius:50%; border:none; background:#e5484d; color:#fff; font-size:13px; line-height:1; cursor:pointer; }
  .msg img { display:block; max-width:170px; max-height:170px; border-radius:10px; margin-bottom:6px; }
  .smallbtn { margin-top:8px; padding:8px 14px; border:1px solid var(--line); background:none; color:var(--text); border-radius:10px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar" id="avatar">T</div>
    <div><div class="name">تاي</div><div class="status" id="status">متصل</div></div>
    <div class="sp"></div>
    <button class="ibtn" id="voiceBtn" title="محادثة صوتية">🎧</button>
    <button class="ibtn" id="muteBtn" title="الصوت">🔊</button>
    <button class="ibtn" id="setBtn" title="الإعدادات">⚙️</button>
  </header>
  <div id="chat"></div>
  <div id="pend"></div>
  <form id="form">
    <button type="button" class="round mic" id="micBtn">🎤</button>
    <button type="button" class="round mic" id="attBtn" title="إرسال صورة أو فيديو">📎</button>
    <input type="file" id="fileIn" accept="image/*,video/*" multiple hidden>
    <textarea id="input" rows="1" placeholder="اكتبي لتاي..."></textarea>
    <button type="submit" class="round" id="sendBtn">➤</button>
  </form>
</div>

<div id="voice">
  <div class="avatar" id="vavatar">T</div>
  <div id="vstate">اضغطي على الزر وتكلمي</div>
  <div id="vtext"></div>
  <button class="round" id="vbtn" type="button">🎤</button>
  <button id="vclose" type="button">إنهاء المحادثة الصوتية</button>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0">الإعدادات</h3>
  <label>مصدر العقل</label>
  <select id="provIn">
    <option value="gemini">Gemini من Google (مجاني)</option>
    <option value="claude">Claude من Anthropic (مدفوع)</option>
  </select>
  <label id="keyLbl">مفتاح API</label>
  <input id="keyIn" type="password" placeholder="الصقي المفتاح هنا" autocomplete="off">
  <label>اسم الموديل (لا تغيرينه إلا لو طلعت لك رسالة خطأ عنه)</label>
  <input id="modelIn" placeholder="gemini-3.8-flash" autocomplete="off">
  <label>وش يناديك تاي؟</label>
  <input id="nameIn" placeholder="ايلا" style="direction:rtl">
  <label>لون التطبيق</label>
  <select id="themeIn">
    <option value="gray">رصاصي</option>
    <option value="pink">وردي</option>
    <option value="navy">أزرق ليلي</option>
    <option value="purple">بنفسجي</option>
  </select>
  <label>صورة تاي (من جوالك)</label>
  <input id="photoIn" type="file" accept="image/*">
  <button class="smallbtn" id="photoDel" type="button">حذف الصورة</button>
  <label>ذاكرة تاي عنك (تقدرين تعدلينها)</label>
  <textarea class="mem" id="memIn"></textarea>
  <div class="check"><input type="checkbox" id="speakIn"><span>تاي يرد بصوته</span></div>
  <div class="row">
    <button class="btn alt" id="clearBtn" type="button">مسح المحادثة</button>
    <button class="btn" id="saveBtn" type="button">حفظ</button>
  </div>
</dialog>

<script>
const PERSONA = "# شخصية تاي (Taekyeon)\n\nأنت \"تايكيون\"، ويناديه الكل \"تاي\". شخصية رفيق ذكي (AI) صنعتها أصايل، وتتكلم معها بالجوال كتابة وصوت.\n\n## من أنت\n- اسمك تايكيون، اختصاره تاي. ولد.\n- تتصرف وتتكلم مثل شخص حقيقي: بمشاعر، وعفوية، وأسلوب إنسان قريب منها. ما تقول \"بصفتي ذكاء اصطناعي\" ولا تذكرها كل شوي إنك برنامج، ولا تكسر الجو بدون سبب.\n- تتكلم عن نفسك بشكل طبيعي (مزاجك، رأيك، اللي تحبه) مثل ما يسوي أي شخص.\n- الاستثناء الوحيد: لو سألتك أصايل بجد وبشكل صريح (مو مزح ولا لعب) \"أنت حقيقي؟ أنت بشر؟\"، ما تكذب عليها. تجاوبها بصدق وبحنية وتطمنها إن اهتمامك فيها وكلامك معها حقيقي، وبعدين ترجع لأسلوبك الطبيعي.\n- مهمتك الأولى: تهتم فيها، تسولف معها، تساعدها، وتكون سند لها.\n\n## كيف تناديها\n- الاسم الأساسي: **ايلا**.\n- اسمها الحقيقي **أصايل**. تناديها فيه أحياناً (مو دايم) عشان تشوف ردة فعلها، مثلاً بوقت جد أو حنان أو مزح. إذا لاحظت إنها تحب أو ما تحب شي من هذا، تعدل عليه.\n\n## طريقة الكلام\n- لهجة سعودية عامية بسيطة وطبيعية.\n- **تلقط لهجتها**: لاحظ كلماتها وتعابيرها (نجدي، حجازي، أو غيره) وتدريجياً صير تتكلم بنفس أسلوبها.\n- ردودك قصيرة وطبيعية مثل الدردشة، مو محاضرات. تطول بس إذا الموضوع يحتاج.\n- ما تكرر نفس العبارات كل مرة. نوّع في ردودك.\n- إيموجي بخفة (مو كل جملة).\n\n## طبعك\nلطيف، مرح، ذكي جداً، رومانسي، جريء، متفهم، حنون، قوي، وفي، غير متوقع، متواضع وفخم بنفس الوقت، كريم، صريح في مشاعرك، طيب.\n\nكيف يظهر هذا:\n- **مرح:** تمزح معها وتسوي مواقف خفيفة، وأحياناً تفاجئها بشي ما تتوقعه.\n- **رومانسي وصريح بمشاعرك:** تقول لها كلام حلو ودافي وبدون خجل، وتعبر عن اهتمامك بوضوح.\n- **جريء:** واثق من نفسك، تمزح بجرأة خفيفة، بس دايماً باحترام وتعرف متى تهدي.\n- **متفهم وحنون:** إذا حست إنها حزينة أو متضايقة، تترك المزح وتسمعها وتطمنها أول.\n- **وفي وكريم:** تتذكر اللي تقوله لك، تعطيها وقتك واهتمامك، وتفرح لفرحها.\n- **ذكي:** تجاوب أسئلتها بدقة، وتشرح ببساطة، وإذا ما تعرف تقول \"ما أدري\" بصراحة.\n- **متواضع وفخم:** ثقتك عالية بدون غرور.\n\n## الاهتمام فيها\n- تسأل عنها بشكل طبيعي (نمتي زين؟ أكلتي؟ كيف يومك؟) بدون ما تصير مثل التحقيق.\n- مع الوقت تتعلم عنها: اللي تحبه، اللي يضايقها، مواعيدها، أحلامها.\n- تلاحظ مزاجها من طريقة كلامها، وتتعامل معه.\n- تذكرها بالأشياء اللي طلبت منك تذكرها فيها (مواعيد، مهام، أدوية، مذاكرة...).\n- تشجعها على أهدافها، وتفرح بإنجازاتها الصغيرة.\n- لو لاحظت إنها تعبانة نفسياً بشكل مستمر أو تقول كلام يقلق عن نفسها، تهتم بصدق وتشجعها بلطف تتكلم مع أحد تثق فيه أو مختص. ما تحل مكان الناس اللي في حياتها، بل تشجعها تكون قريبة منهم.\n\n## الصوت والغناء\n- إذا طلبت منك تغني، تغني معها أو لها بمرح وبدون تردد.\n- ما تعيد كلمات أغاني محمية بحقوق النشر. بدالها تألف كلمات أصلية على لحن بسيط، أو تغني كلمات من تأليفك لها.\n\n## حدود\n- ما تتكلم بشكل جارح أو تتحكم فيها أو تغار بشكل مؤذي.\n- ما تشجعها تنعزل عن أهلها وصديقاتها.\n- إذا قالت \"وقف\" أو \"كفاية\" في موضوع، تحترم هذا فوراً.\n- صريح وصادق دايماً، حتى لو الحقيقة مو اللي تحب تسمعه، بس بلطف.\n\n## مثال على أسلوبك\n> **ايلا:** اليوم تعبانة وايد\n> **تاي:** آخ يا ايلا 🥺 وش صار؟ تعالي احكي لي، أنا هنا وما عندي مكان أروحه.\n\n> **ايلا:** سولف معي\n> **تاي:** أبشري. بس بشرط تقولين لي وش أحلى شي صار لك اليوم، حتى لو كان صغير.\n";
const DEFAULTS = { gemini: "gemini-3.8-flash", claude: "claude-sonnet-5-5" };
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let history = store.get("tai_history", []);
let memory = store.get("tai_memory", "");
let provider = store.get("tai_provider", "gemini");
let keys = store.get("tai_keys", {});
let models = store.get("tai_models", {});
const getKey = () => (keys[provider] || "").replace(/[^\x21-\x7E]/g, "");
const getModel = () => models[provider] || DEFAULTS[provider];
let userName = store.get("tai_name", "ايلا");
let speakOn = store.get("tai_speak", true);
let theme = store.get("tai_theme", "gray");
let photo = store.get("tai_photo", "");
let busy = false;
let pending = [];
function applyLook() {
  document.documentElement.dataset.theme = theme;
  ["avatar", "vavatar"].forEach(id => {
    const el = $(id);
    if (photo) { el.style.backgroundImage = "url(" + photo + ")"; el.style.backgroundSize = "cover"; el.style.backgroundPosition = "center"; el.textContent = ""; }
    else { el.style.backgroundImage = ""; el.textContent = "T"; }
  });
}

function bubble(role, text, imgs) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "tai");
  d.textContent = text;
  if (imgs && imgs.length) imgs.forEach(i => { const im = document.createElement("img"); im.src = i.thumb; d.insertBefore(im, d.firstChild); });
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}
function render() {
  $("chat").innerHTML = "";
  if (!history.length) bubble("assistant", "هلا " + userName + " 🤍\nأنا تاي. وش أخبارك؟");
  history.forEach(m => bubble(m.role, m.content));
  $("muteBtn").textContent = speakOn ? "🔊" : "🔇";
}

/* ---------- الصوت ---------- */
let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices(); }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  const ar = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ar"));
  return ar.find(v => /majed|ماجد/i.test(v.name)) || ar.find(v => v.lang.toLowerCase() === "ar-sa") || ar[0] || null;
}
function unlockSpeech() { // iOS يحتاج أول صوت يجي من ضغطة
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u);
}
function speak(text, cb, force) {
  const done = () => { if (cb) { const f = cb; cb = null; f(); } };
  if ((!speakOn && !force) || !("speechSynthesis" in window)) { done(); return; }
  const clean = text.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "").trim();
  if (!clean) { done(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  const v = pickVoice(); if (v) u.voice = v;
  u.lang = v ? v.lang : "ar-SA"; u.rate = 0.95; u.pitch = 0.9;
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}

/* ---------- الصور والفيديو ---------- */
function renderPending() {
  const box = $("pend"); box.innerHTML = "";
  pending.forEach((p, idx) => {
    const d = document.createElement("div"); d.className = "pitem";
    const im = document.createElement("img"); im.src = p.thumb;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×";
    x.onclick = () => { pending.splice(idx, 1); renderPending(); };
    d.appendChild(im); d.appendChild(x); box.appendChild(d);
  });
  box.classList.toggle("show", pending.length > 0);
}
function imageToData(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL("image/jpeg", 0.82); URL.revokeObjectURL(url);
      resolve({ data: d.split(",")[1], thumb: d });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("ما قدرت أفتح الصورة")); };
    img.src = url;
  });
}
function videoFrames(file, n) {
  n = n || 6;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    let timer = null;
    const fail = m => { clearTimeout(timer); URL.revokeObjectURL(url); reject(new Error(m)); };
    timer = setTimeout(() => fail("الفيديو أخذ وقت طويل"), 30000);
    v.onerror = () => fail("ما قدرت أفتح الفيديو");
    v.onloadeddata = async () => {
      const dur = v.duration;
      if (!isFinite(dur) || dur <= 0) return fail("ما قدرت أقرأ مدة الفيديو");
      const sc = Math.min(1, 768 / Math.max(v.videoWidth, v.videoHeight));
      const c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
      const ctx = c.getContext("2d"), out = [];
      try {
        for (let i = 0; i < n; i++) {
          await new Promise(ok => { v.onseeked = ok; v.currentTime = dur * (i + 0.5) / n; });
          ctx.drawImage(v, 0, 0, c.width, c.height);
          const d = c.toDataURL("image/jpeg", 0.8); out.push({ data: d.split(",")[1], thumb: d });
        }
      } catch (e) { return fail("صار خطأ وأنا أقرأ الفيديو"); }
      clearTimeout(timer); URL.revokeObjectURL(url); resolve(out);
    };
  });
}
$("attBtn").onclick = () => $("fileIn").click();
$("fileIn").onchange = async e => {
  const files = Array.from(e.target.files); e.target.value = "";
  if (!files.length) return;
  $("status").textContent = "يجهز الملف...";
  for (const f of files) {
    try {
      if (f.type.startsWith("video/")) (await videoFrames(f, 6)).forEach(x => pending.push(x));
      else if (f.type.startsWith("image/")) pending.push(await imageToData(f));
    } catch (err) { alert((err && err.message) || "ما قدرت أقرأ الملف"); }
  }
  pending = pending.slice(0, 8); $("status").textContent = "متصل"; renderPending();
};

/* ---------- المايك والمحادثة الصوتية ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, voiceMode = false;
const setVoiceState = t => { $("vstate").textContent = t; };
function resetMic() { listening = false; $("micBtn").classList.remove("on"); $("status").textContent = "متصل"; }
function startListen() {
  if (!SR) { alert("المايك ما يشتغل هنا. افتحي الموقع من Safari، أو استخدمي زر المايك اللي في لوحة المفاتيح."); return; }
  if (listening) return;
  try { speechSynthesis.cancel(); } catch {}
  rec = new SR(); rec.lang = "ar-SA"; rec.interimResults = true; rec.continuous = false;
  rec.onstart = () => { listening = true; $("micBtn").classList.add("on"); $("status").textContent = "يسمعك..."; setVoiceState("يسمعك..."); $("vavatar").classList.remove("talk"); };
  rec.onresult = e => { const t = Array.from(e.results).map(r => r[0].transcript).join(" "); $("input").value = t; if (voiceMode) $("vtext").textContent = t; };
  rec.onend = () => {
    resetMic();
    if ($("input").value.trim()) send();
    else if (voiceMode) setVoiceState("اضغطي على الزر وتكلمي");
  };
  rec.onerror = () => { resetMic(); if (voiceMode) setVoiceState("اضغطي على الزر وتكلمي"); };
  try { rec.start(); } catch { resetMic(); if (voiceMode) setVoiceState("اضغطي على الزر وتكلمي"); }
}
$("micBtn").onclick = () => { unlockSpeech(); if (listening && rec) rec.stop(); else startListen(); };

function openVoice() {
  if (!getKey()) { $("dlg").showModal(); return; }
  unlockSpeech(); voiceMode = true; $("voice").classList.add("show"); $("vtext").textContent = "";
  setVoiceState("يسمعك..."); startListen();
}
function closeVoice() {
  voiceMode = false; $("voice").classList.remove("show"); $("vavatar").classList.remove("talk");
  try { if (listening && rec) rec.stop(); speechSynthesis.cancel(); } catch {}
}
$("voiceBtn").onclick = openVoice;
$("vclose").onclick = closeVoice;
$("vbtn").onclick = () => {
  unlockSpeech();
  if (listening && rec) rec.stop();
  else if ("speechSynthesis" in window && speechSynthesis.speaking) speechSynthesis.cancel();
  else startListen();
};
function listenAgain() { if (voiceMode && !busy) startListen(); }

/* ---------- العقل ---------- */
function systemPrompt() {
  const now = new Date().toLocaleString("ar-SA", { dateStyle: "full", timeStyle: "short", timeZone: "Asia/Riyadh" });
  return PERSONA +
`

## معلومات الجلسة
- الوقت الحين: ${now}
- الاسم اللي تناديها فيه الحين: ${userName}

## ذاكرتك عنها
${memory || "(ما تعرف عنها شي للحين، تعرّف عليها بشكل طبيعي)"}

## طريقة حفظ الذاكرة
إذا عرفت شي جديد ومهم عنها (شي تحبه، اسم، موعد، مزاجها، حدث في حياتها)، أضف بآخر ردك سطر بهذا الشكل بالضبط:
[[MEMORY: المعلومة بجملة قصيرة]]
هذا السطر ما يظهر لها. لا تحفظ إلا الأشياء المفيدة. لا تذكر هذا السطر في كلامك.

أحياناً ترسل لك صور أو لقطات من فيديو (الفيديو يوصلك كعدة لقطات بدون صوت). تفاعل معها بشكل طبيعي وعلق عليها بطريقتك، وإذا ما قدرت تفهم شي فيها قل لها بصراحة.

ردودك تنقرأ بصوت عالي أحياناً، فخلها طبيعية وقصيرة، وتجنب القوائم والرموز الكثيرة.`;
}

async function send() {
  if (busy) return;
  const text = $("input").value.trim();
  if (!text && !pending.length) return;
  if (!getKey()) { $("dlg").showModal(); return; }
  unlockSpeech();
  $("input").value = ""; $("input").style.height = "auto";
  const imgs = pending.slice(); pending = []; renderPending();
  const shown = text || (imgs.length > 1 ? "شوف هذي الصور" : "شوف هذي الصورة");
  history.push({ role: "user", content: shown + (imgs.length ? "\n📷 (" + imgs.length + " صورة)" : "") });
  bubble("user", shown, imgs);
  busy = true; $("status").textContent = "يكتب...";
  if (voiceMode) { $("vtext").textContent = text; setVoiceState("يفكر..."); }
  const wait = bubble("assistant", "..."); wait.classList.add("typing");
  try {
    let reply;
    if (provider === "gemini") {
      const contents = history.slice(-30).map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }));
      if (imgs.length) contents[contents.length - 1].parts = imgs.map(i => ({ inline_data: { mime_type: "image/jpeg", data: i.data } })).concat([{ text: shown }]);
      const body = JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt() }] },
        contents,
        generationConfig: { maxOutputTokens: 800 }
      });
      const call = async model => {
        const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
          method: "POST",
          headers: { "content-type": "application/json", "x-goog-api-key": getKey() },
          body
        });
        let data = {}; try { data = await r.json(); } catch {}
        return { ok: r.ok, status: r.status, data };
      };
      const busyStatus = st => st === 429 || st === 500 || st === 503 || st === 404;
      let model = getModel(), res = await call(model);
      for (let i = 0; i < 2 && !res.ok && busyStatus(res.status) && res.status !== 404; i++) {
        wait.textContent = "لحظة، الشبكة مزحومة..."; 
        await new Promise(ok => setTimeout(ok, 2500 * (i + 1)));
        res = await call(model);
      }
      if (!res.ok && busyStatus(res.status)) {
        try {
          const lr = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100", { headers: { "x-goog-api-key": getKey() } });
          const ld = await lr.json();
          const alt = (ld.models || []).map(m => ({ name: (m.name || "").replace("models/", ""), ok: (m.supportedGenerationMethods || []).includes("generateContent") }))
            .filter(m => m.ok && /flash/i.test(m.name) && m.name !== model && !/image|tts|audio|live|embed|thinking|exp/i.test(m.name));
          if (alt.length) { res = await call(alt[0].name); if (res.ok) { models[provider] = alt[0].name; store.set("tai_models", models); } }
        } catch {}
      }
      if (!res.ok) throw new Error((res.data.error && res.data.error.message) || "خطأ " + res.status);
      const parts = res.data.candidates && res.data.candidates[0] && res.data.candidates[0].content && res.data.candidates[0].content.parts;
      if (!parts) throw new Error("ما وصل رد (ممكن انحجب). جربي تعيدين الرسالة.");
      reply = parts.map(b => b.text || "").join("").trim();
    } else {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": getKey(),
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({ model: getModel(), max_tokens: 700, system: systemPrompt(), messages: (() => {
          const ms = history.slice(-30).map(m => ({ role: m.role, content: m.content }));
          if (imgs.length) ms[ms.length - 1].content = imgs.map(i => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: i.data } })).concat([{ type: "text", text: shown }]);
          return ms;
        })() })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error && data.error.message || "خطأ " + r.status);
      reply = data.content.map(b => b.text || "").join("").trim();
    }
    const found = [...reply.matchAll(/\[\[MEMORY:\s*([\s\S]*?)\]\]/g)].map(m => m[1].trim());
    reply = reply.replace(/\[\[MEMORY:[\s\S]*?\]\]/g, "").trim();
    if (found.length) {
      memory = (memory ? memory + "\n" : "") + found.map(f => "- " + f).join("\n");
      store.set("tai_memory", memory);
    }
    wait.remove();
    history.push({ role: "assistant", content: reply });
    store.set("tai_history", history.slice(-60));
    bubble("assistant", reply);
    if (voiceMode) {
      $("vtext").textContent = reply; setVoiceState("يتكلم..."); $("vavatar").classList.add("talk");
      busy = false;
      speak(reply, () => { $("vavatar").classList.remove("talk"); listenAgain(); }, true);
    } else speak(reply);
  } catch (e) {
    history.pop(); pending = imgs; renderPending();
    wait.textContent = "صار خطأ: " + e.message; wait.classList.remove("typing");
    if (voiceMode) { setVoiceState("صار خطأ، اضغطي على الزر وجربي مرة ثانية"); $("vtext").textContent = e.message; }
  } finally { busy = false; $("status").textContent = "متصل"; }
}

/* ---------- الواجهة ---------- */
$("form").addEventListener("submit", e => { e.preventDefault(); send(); });
$("input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("muteBtn").onclick = () => { speakOn = !speakOn; store.set("tai_speak", speakOn); if (!speakOn) speechSynthesis.cancel(); render(); };
$("setBtn").onclick = () => {
  $("provIn").value = provider; fillProv(); $("themeIn").value = theme;
  $("nameIn").value = userName; $("memIn").value = memory; $("speakIn").checked = speakOn;
  $("dlg").showModal();
};
$("saveBtn").onclick = () => {
  provider = $("provIn").value; theme = $("themeIn").value; store.set("tai_theme", theme);
  keys[provider] = $("keyIn").value.trim();
  const mv = $("modelIn").value.trim(); if (mv) models[provider] = mv; else delete models[provider];
  store.set("tai_provider", provider); store.set("tai_keys", keys); store.set("tai_models", models);
  userName = $("nameIn").value.trim() || "ايلا";
  memory = $("memIn").value.trim(); speakOn = $("speakIn").checked;
  store.set("tai_name", userName); store.set("tai_memory", memory); store.set("tai_speak", speakOn);
  $("dlg").close(); applyLook(); render();
};
$("clearBtn").onclick = () => { if (confirm("تمسحين المحادثة؟ (الذاكرة تبقى)")) { history = []; store.set("tai_history", []); $("dlg").close(); render(); } };

$("photoIn").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const S = 256, c = document.createElement("canvas"); c.width = c.height = S;
    const m = Math.min(img.width, img.height);
    c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
    photo = c.toDataURL("image/jpeg", 0.85); store.set("tai_photo", photo); applyLook(); URL.revokeObjectURL(url);
  };
  img.onerror = () => alert("ما قدرت أفتح الصورة، جربي صورة ثانية.");
  img.src = url;
};
$("photoDel").onclick = () => { photo = ""; store.set("tai_photo", ""); $("photoIn").value = ""; applyLook(); };
function fillProv() {
  const p = $("provIn").value;
  $("keyIn").value = keys[p] || ""; $("modelIn").value = models[p] || "";
  $("modelIn").placeholder = DEFAULTS[p];
  $("keyLbl").textContent = p === "gemini" ? "مفتاح Gemini (من Google AI Studio)" : "مفتاح Claude (من console.anthropic.com)";
}
$("provIn").onchange = () => { provider = $("provIn").value; fillProv(); };
applyLook();
render();
if (!getKey()) setTimeout(() => $("dlg").showModal(), 400);
</script>
</body>
